name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Leave GITHUB_TOKEN out of the git config. changesets/action pushes
          # the Version Packages branch with the token below through a netrc,
          # and git prefers the header checkout persists over a netrc, so every
          # update to that branch went out as github-actions[bot]. A push by
          # that token raises no usable `pull_request` run, so an updated
          # Version Packages pull request got no CI and auto-merge waited
          # forever. Only the first push, which opens the pull request, arrived
          # as RELEASE_PAT's user. MikeNotThePope/lavahire#798.
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # npm OIDC trusted publishing requires npm >= 11.5.1; npm 12 requires node >= 22.
      - run: npm install -g npm@latest

      - run: bun install --frozen-lockfile

      - run: bun run audit:contrast
      - run: bun run build:lib

      # `changeset publish` decides what to publish by asking npm what is
      # already there, and here it cannot: setup-node writes an .npmrc pointing
      # at NODE_AUTH_TOKEN, which is a placeholder because publishing
      # authenticates over OIDC instead. The lookup comes back empty, so it
      # tries to publish whatever is in package.json. On a Version Packages
      # merge that is right. On every other push to main it retries the version
      # already on npm, npm answers "cannot publish over the previously
      # published versions", and the job goes red for no reason — which is what
      # every docs-only merge did until this guard. Ask npm ourselves, with the
      # generated .npmrc out of the way, and hand the action an empty `publish`
      # when there is nothing to publish. Empty means "open the version PR
      # only", which is exactly the other half of its job.
      - name: Is this version already on npm?
        id: probe
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          versions=$(NPM_CONFIG_USERCONFIG=/dev/null npm view "$name" versions --json 2>/dev/null || echo '[]')
          if node -e 'process.exit([].concat(JSON.parse(process.argv[1])).includes(process.argv[2]) ? 0 : 1)' "$versions" "$version"; then
            echo "$name@$version is on npm already; version PR only."
            echo "publish=" >> "$GITHUB_OUTPUT"
          else
            echo "$name@$version is not on npm; publishing."
            echo "publish=bun run release" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: ${{ steps.probe.outputs.publish }}
          version: bun run version
        env:
          # GITHUB_TOKEN would work here, but a PR it opens raises no
          # `pull_request` event — GitHub refuses to let a workflow trigger a
          # workflow — so `verify` never runs on the Version Packages PR and
          # branch protection blocks the merge. RELEASE_PAT makes that PR an
          # ordinary one, and CI runs on it like any other. See
          # docs/deployment.md for how to mint it. Falls back to GITHUB_TOKEN,
          # which still publishes correctly; only the release PR loses its CI.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          # No npm token: publish authenticates via OIDC trusted publishing
          # (configured on the npm package). Requires `id-token: write` above
          # and npm >= 11.5.1 (installed above). Provenance is part of OIDC.
          NPM_CONFIG_PROVENANCE: "true"

      # lavahire pins this package on a caret range, so a new minor lands
      # there silently, inside whatever unrelated pull request next
      # reinstalls. 1.26.1 arrived exactly that way and the workaround it
      # needed is still in that repository's `app/globals.css`, in a pull
      # request that had nothing to do with the design system. This nudge
      # makes the bump its own pull request there, carrying the version in
      # its title, with CI and a smoke run on it: the first place a break in
      # this package is seen is then a red check that names the release.
      # MikeNotThePope/lavahire#800.
      #
      # It carries no payload. The receiving workflow reads the version from
      # npm's own `latest` tag, so there is nothing here to keep in step with
      # anything there, and a re-fire cannot install something npm is not
      # serving.
      #
      # Only on a real publish, which is what `published` says. The other
      # branch of this job opens the Version Packages pull request and puts
      # nothing on npm, and a bump pull request for a version npm does not
      # have yet would fail to install.
      #
      # A missing secret fails the step rather than skipping quietly. The
      # publish has already happened by then, so the red is the honest
      # outcome: the version is out and lavahire was not told. The `secrets`
      # context cannot be read in an `if`, which is why this is a test in the
      # shell rather than a condition above.
      - name: Tell lavahire a version is out
        if: steps.changesets.outputs.published == 'true'
        env:
          TOKEN: ${{ secrets.LAVAHIRE_DISPATCH_TOKEN }}
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          set -euo pipefail
          echo "published: $PUBLISHED"

          if [ -z "$TOKEN" ]; then
            echo "LAVAHIRE_DISPATCH_TOKEN is not set, so lavahire was not told and its pin stays where it is."
            echo "Settings -> Secrets and variables -> Actions. A fine-grained PAT scoped to MikeNotThePope/lavahire alone, with Contents: read and write, which is what repository_dispatch needs and all it needs."
            exit 1
          fi

          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/MikeNotThePope/lavahire/dispatches \
            -d '{"event_type":"substrateui-released"}'

          echo "lavahire dispatched; it opens the bump pull request from here."

      # The Version Packages pull request used to wait for Mike's hand, and
      # that hand followed the first merge by minutes every time (#120 merged
      # 11:44, #121 11:47) and read nothing. So the run that opens or updates
      # it also arms auto-merge on it: `verify` and `check` stay the gate, and
      # only the click after them is gone. The bump is read after the fact,
      # on the Releases page. The repository variable RELEASE_PAUSED set to
      # `1` is the stop: the step arms nothing and says so, and the pull
      # request waits for a hand, as before. The variable is read in the
      # shell rather than in `if:` so the log shows the value it saw; a
      # skipped step says nothing, and the first run with it "set" armed
      # anyway. Setting it back arms nothing by itself; the next push to
      # main, or a re-run of the last release run, does.
      #
      # RELEASE_PAT is required here, not a fallback. A pull request the
      # built-in GITHUB_TOKEN opened raises no `pull_request` event, so
      # `verify` never runs on it and auto-merge would wait forever. Failing
      # the step is the visible version of that. MikeNotThePope/lavahire#798.
      - name: Merge the Version Packages pull request when it is green
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.changesets.outputs.pullRequestNumber }}
          PAUSED: ${{ vars.RELEASE_PAUSED }}
        run: |
          paused=$(printf '%s' "$PAUSED" | tr -d '[:space:]')
          if [ "$paused" = 1 ]; then
            echo "RELEASE_PAUSED is 1: #$PR waits for a hand. Set it to 0, then re-run this run or push to main, and it arms."
            exit 0
          fi
          echo "RELEASE_PAUSED is '$paused', not 1: arming auto-merge on #$PR."
          if [ -z "$GH_TOKEN" ]; then
            echo "RELEASE_PAT is not set, so #$PR was opened as github-actions[bot]: verify never runs on it and auto-merge would wait forever. Merge it by hand; docs/deployment.md says how to mint the token."
            exit 1
          fi
          # A second changeset merge updates a pull request that is armed
          # already, and GitHub refuses to arm it twice.
          if [ "$(gh pr view "$PR" --json autoMergeRequest -q '.autoMergeRequest != null')" = true ]; then
            echo "#$PR is armed already; it merges itself when verify and check are green."
            exit 0
          fi
          if gh pr merge "$PR" --squash --auto; then
            echo "#$PR merges itself when verify and check are green."
            exit 0
          fi
          # GitHub refuses to arm auto-merge on a pull request with nothing
          # left to wait for ("clean status"). Then it is green already.
          if [ "$(gh pr view "$PR" --json mergeStateStatus -q .mergeStateStatus)" = CLEAN ]; then
            exec gh pr merge "$PR" --squash
          fi
          exit 1
