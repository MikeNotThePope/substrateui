# Writes the visual baselines `main` is missing, and never touches one it has.
#
# A new page ships before its baseline does: the specs skip a screenshot with
# no baseline (tests/visual/baseline.ts), so the pull request adding a
# component stays green. Before this, the baseline appeared only when Mike next
# ran Update Visual Baselines, so a new component merged unguarded and stayed
# that way. A lavahire session builds components here unattended, so waiting
# for a hand stopped its chain for a snapshot nobody had anything to compare.
#
# Add-only is the whole rule. `--update-snapshots=missing` writes a baseline
# that does not exist and leaves every existing one alone, so a changed
# component still fails and still waits for Mike's review and Update Visual
# Baselines (AGENTS.md). Running from `main` means a branch that never merges
# cannot put its pixels in the one archive every branch reads. Rejected: a
# session dispatching Update Visual Baselines for a new component, which
# overwrites the whole archive from an unmerged branch.
#
# The run compares everything else too, and a mismatch there is CI's to
# report, not this job's: the test step may fail, and the upload still goes
# ahead with whatever was missing. The archive it uploads is the one it
# downloaded plus the new files, since `missing` rewrites nothing.
#
# One archive, so one writer at a time: this and Update Visual Baselines share
# a concurrency group, and neither cancels the other.
name: Capture Missing Baselines

on:
  push:
    branches: [main]

concurrency:
  group: baseline-archive
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run snapshots:download

      - name: List the baselines main already has
        run: find tests/visual -path '*-snapshots/*.png' | sort > "$RUNNER_TEMP/before.txt"

      - name: Write the missing ones
        continue-on-error: true
        env:
          CAPTURE_MISSING: '1'
        run: bunx playwright test --update-snapshots=missing

      - name: Upload if anything was added
        run: |
          find tests/visual -path '*-snapshots/*.png' | sort > "$RUNNER_TEMP/after.txt"
          added=$(comm -13 "$RUNNER_TEMP/before.txt" "$RUNNER_TEMP/after.txt")
          if [ -z "$added" ]; then
            echo "No baseline was missing. Nothing uploaded." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          { echo "Added baselines:"; echo '```'; echo "$added"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          bun run snapshots:upload
